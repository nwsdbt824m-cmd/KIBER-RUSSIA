name: Build APK

on:
  push:
    # Звёздочка означает, что сборка запустится при пуше в ЛЮБУЮ ветку
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  # Этот параметр добавляет кнопку для запуска сборки вручную в интерфейсе GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: List files in repository
      run: ls -la
