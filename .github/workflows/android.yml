name: "Проверка файлов KIBER RUSSIA"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Показать структуру папок
        run: |
          echo "=== Список всех файлов в вашем репозитории ==="
          find . -not -path '*/.*'
