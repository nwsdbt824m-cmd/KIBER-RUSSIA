name: "Сборка KIBER RUSSIA"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Находим проект и собираем APK
        run: |
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Критическая ошибка: файл gradlew не найден в репозитории!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIBER-RUSSIA-APK
          path: "**/build/outputs/apk/debug/*.apk"
